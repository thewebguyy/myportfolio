name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    # Provide a safe default so all steps have a non-empty value even when
    # the secret is absent (e.g. forks / external PRs).
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'mock-key-for-ci' }}

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Verify lockfile existence
        run: |
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is missing! Please commit your lockfile."
            exit 1
          fi

      - name: Install dependencies (Strict)
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      - name: Run type check
        run: npm run type-check
        continue-on-error: true

      - name: Run tests
        run: npm run test:ci
        env:
          CI: true
          # OPENAI_API_KEY inherited from job-level env above

      - name: Build application
        run: npm run build
        # OPENAI_API_KEY inherited from job-level env above

      - name: Upload build artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next
          retention-days: 7
